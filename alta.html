<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECommerce (alta)</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/alta.css">
</head>
<body>
    
    <header>
        
        <div>
            
            <div id="logo"></div>
            
            <div id="navegacion">

                <nav>
                    <ul>
                        <li> <a href="./index.html">Inicio</a> </li>
                        <li> <a href="./alta.html">Alta</a> </li>
                        <li> <a href="./carrito.html">Carrito</a> </li>
                        <li> <a href="./contacto.html">Contacto</a> </li>
                        <li> <a href="./nosotros.html">Nosotros</a> </li>
                        <li> <a href="./otra.html">Otra</a> </li>
                    </ul>
                </nav>

                <div id="barra-busqueda">
                    <form action="#">
                        <input type="text">
                        <input type="submit" value="Buscar">
                    </form>
                </div>

            </div>
            
            <div id="boton-carrito">🛒</div>

        </div>
        
    </header>

    <main>

        <div id="formulario">

            <h1>Alta de Productos</h1>

            <form action="#" class="alta-form">

                <div id="campos">
                    
                    <div class="row-group" id="first-row">

                        <div class="input-group">
                            <label for="nombre">nombre</label>
                            <input
                                id="nombre"
                                type="text"
                                name="nombre"
                                required
                                minlength="3"
                            >
                        </div>
                        
                        <div class="input-group">
                            <label for="marca">marca</label>
                            <input 
                                id="marca" 
                                type="text" 
                                name="marca"
                                required
                                minlength="3"
                            >
                        </div>

                        <div class="input-group">
                            <label for="categoria">categoría</label>
                            <input 
                                id="categoria"
                                type="text"
                                name="categoria"
                                required
                                minlength="3"
                            >
                        </div>

                    </div>
                    
                    <div class="row-group" id="second-row">

                        <div class="input-group">
                            <label for="descripcion-corta">descripcion corta</label>
                            <textarea 
                                id="descripcion-corta" 
                                name="descripcion-corta" 
                                rows="2"
                                required
                                minlength="3"
                            ></textarea>
                        </div>
                        
                        <div class="input-group">
                            <label for="descripcion-larga">descripcion larga</label>
                            <textarea 
                                id="descripcion-larga" 
                                name="descripcion-larga" 
                                rows="2"
                                required
                                minlength="3"
                            ></textarea>
                        </div>

                    </div>
                    
                    <div class="row-group" id="third-row">

                        <div class="input-group">
                            <label for="precio">precio</label>
                            <input
                                id="precio"
                                type="number"
                                name="precio"
                                required
                                min="0.01"
                                step="0.01"
                            >
                        </div>
                        
                        <div class="input-group">
                            <label for="stock">stock</label>
                            <input
                                id="stock"
                                type="number"
                                name="stock"
                                required
                                min="1"
                                step="1"
                            >
                        </div>

                        <div class="input-group">
                            <label for="edad-desde">edad desde</label>
                            <input
                                id="edad-desde"
                                type="number"
                                name="edad-desde"
                                required
                                min="1"
                                step="1"
                            >
                        </div>
                        
                        <div class="input-group">
                            <label for="edad-hasta">edad hasta</label>
                            <input id="edad-hasta"
                                type="number"
                                name="edad-hasta"
                                required
                                min="1"
                                step="1"
                            >
                        </div>

                        <div class="input-group">
                            <label for="envio">envío sin cargo</label>
                            <input id="envio" type="checkbox" name="envio">
                        </div>

                    </div>                    
                
                    <div class="row-group" id="last-row">

                        <div class="input-group">
                            <label for="foto">foto</label>
                            <input
                                id="foto"
                                type="url"
                                name="foto"
                                required
                            >
                        </div>

                    </div>
          
                </div>

                <div id="boton">
                    <button>Agregar</button>
                </div>

            </form>

            <div id="errores-validacion"></div>

        </div>

        <hr>

        <div id="tabla">

            <h2>Listado de productos disponibles</h2>

            <div class="responsive">
                <table></table>
            </div>

        </div>
        
    </main>

    <footer>

        <div>

            <div class="footer-left">
                <h3>TechStore</h3>
                <p>Tu tienda de tecnología y componentes de PC</p>
            </div>

            <div class="footer-links">
                <a href="./index.html">Inicio</a>
                <a href="./contacto.html">Contacto</a>
                <a href="./nosotros.html">Nosotros</a>
            </div>

            <div class="footer-copy">
                &copy; Copyright 2026 - TechStore
            </div>

        </div>

    </footer>

    <script src="js/productos.js"></script>
    <script src="js/alta.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
